<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.65; }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.6; }
      50% { r: 8; opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .bg-grid { opacity: 0.8; }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .data-line { stroke-dasharray: 8 6; animation: flowDash 4s linear infinite; }
    .pulse-dot { animation: pulseNode 3s ease-in-out infinite; }
    .pill-group { animation: subtleFloat 5s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#techGrid)" rx="16" class="bg-grid"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g>
    <circle cx="220" cy="120" r="140" fill="#0284c7" opacity="0.25" filter="url(#heavyGlow)" class="orb-1"/>
    <circle cx="980" cy="300" r="160" fill="#7c3aed" opacity="0.25" filter="url(#heavyGlow)" class="orb-2"/>
    <circle cx="600" cy="380" r="100" fill="#ec4899" opacity="0.15" filter="url(#heavyGlow)"/>
  </g>

  <!-- Dynamic Animated DAG Data Pipelines in Lower Background -->
  <g opacity="0.55">
    <!-- Stream 1 -->
    <path d="M 80 340 C 260 340, 320 280, 480 280 C 640 280, 720 350, 900 350 C 1020 350, 1080 310, 1140 310" 
          fill="none" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 340 C 260 340, 320 280, 480 280 C 640 280, 720 350, 900 350 C 1020 350, 1080 310, 1140 310" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" class="data-line"/>

    <!-- Stream 2 -->
    <path d="M 120 380 C 300 380, 400 320, 560 320 C 700 320, 800 270, 960 270 C 1040 270, 1080 340, 1120 340" 
          fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M 120 380 C 300 380, 400 320, 560 320 C 700 320, 800 270, 960 270 C 1040 270, 1080 340, 1120 340" 
          fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" class="data-line" style="animation-duration: 6s;"/>

    <!-- Transformation Nodes -->
    <circle cx="480" cy="280" r="5" fill="#38bdf8" class="pulse-dot"/>
    <circle cx="560" cy="320" r="4" fill="#818cf8" class="pulse-dot" style="animation-delay: 1s;"/>
    <circle cx="900" cy="350" r="5" fill="#c084fc" class="pulse-dot" style="animation-delay: 1.5s;"/>
    <circle cx="960" cy="270" r="4" fill="#38bdf8" class="pulse-dot" style="animation-delay: 2s;"/>
  </g>

  <!-- Foreground Title and Content (Clear, Crisp, Always in Foreground) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 72)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-145" cy="0" r="5" fill="#22c55e" filter="url(#glow)"/>
      <text x="-130" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1.5">MODERN DATA STACK • CURATED</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1" filter="url(#glow)">
      Awesome Declarative Data Transformation
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      SQL-First Modeling • Virtual Environments • Automated Lineage &amp; Incremental DAGs
    </text>

    <!-- Interactive/Feature Badges Foreground Row -->
    <g class="pill-group" transform="translate(600, 246)">
      <!-- Pill 1: SQL-First -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" fill-opacity="0.9"/>
        <text x="82" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ SQL-First Modeling</text>
      </g>

      <!-- Pill 2: Incremental -->
      <g transform="translate(-175, 0)">
        <rect x="0" y="0" width="165" height="36" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" fill-opacity="0.9"/>
        <text x="82" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🔄 Incremental Logic</text>
      </g>

      <!-- Pill 3: Virtual Environments -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="175" height="36" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" fill-opacity="0.9"/>
        <text x="87" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🌐 Virtual Environments</text>
      </g>

      <!-- Pill 4: Open Source & Cloud -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.2" fill-opacity="0.9"/>
        <text x="80" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399">✨ Open Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>